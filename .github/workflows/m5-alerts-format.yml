name: M5 alerts formatter

on:
  push:
    branches:
      - feat/m5-notifications-hardening
    paths:
      - ".github/workflows/m5-alerts-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/alerts/src/webhook.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet packages/alerts/src/webhook.test.ts; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/alerts/src/webhook.test.ts
          git commit -m "style(alerts): apply canonical webhook test formatting"
          git push
