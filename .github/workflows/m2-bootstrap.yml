name: M2 bootstrap

on:
  push:
    branches:
      - feat/m2-check-engine
    paths:
      - ".github/workflows/m2-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format M2 files
        run: pnpm exec prettier --write packages/shared packages/config packages/assertions packages/probe-engine
      - name: Commit generated updates
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml packages/shared packages/config packages/assertions packages/probe-engine
          git commit -m "chore: finalize M2 dependencies and formatting"
          git push
