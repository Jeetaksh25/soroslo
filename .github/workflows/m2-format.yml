name: M2 formatter

on:
  push:
    branches:
      - feat/m2-check-engine
    paths:
      - ".github/workflows/m2-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/config/src/schema.ts packages/assertions/src/assertion.ts packages/probe-engine/src/engine.ts packages/probe-engine/src/engine.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/config/src/schema.ts packages/assertions/src/assertion.ts packages/probe-engine/src/engine.ts packages/probe-engine/src/engine.test.ts
          git commit -m "style: format M2 fixes"
          git push
