name: M6 fixture bootstrap

on:
  push:
    branches:
      - feat/m6-ecosystem-evidence
    paths:
      - ".github/workflows/m6-fixture-bootstrap.yml"

permissions:
  contents: write

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt

      - name: Generate fixture lockfile
        run: cargo generate-lockfile --manifest-path contracts/fixtures/Cargo.toml

      - name: Format fixture
        run: cargo fmt --manifest-path contracts/fixtures/Cargo.toml -- --check

      - name: Test fixture
        run: cargo test --manifest-path contracts/fixtures/Cargo.toml

      - name: Build fixture WASM
        run: cargo build --manifest-path contracts/fixtures/Cargo.toml --target wasm32v1-none --release

      - name: Commit fixture lockfile
        run: |
          if git diff --quiet -- contracts/fixtures/Cargo.lock; then
            echo "No generated lockfile change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/fixtures/Cargo.lock
          git commit -m "chore: lock M6 fixture dependencies"
          git push
