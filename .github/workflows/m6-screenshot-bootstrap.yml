name: M6 live screenshot bootstrap

on:
  push:
    branches:
      - feat/m6-ecosystem-evidence
    paths:
      - ".github/workflows/m6-screenshot-bootstrap.yml"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOROSLO_TESTNET_FIXTURE_CONTRACT: CBXNPLHGKIKF22QUEFWJFL6C7RY7HMWHMZHXQ5L2M2VXMVMOLL3TKPZW

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build product
        run: pnpm build

      - name: Generate live Testnet dashboard evidence
        run: node scripts/live-demo-data.mjs

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start API and dashboard
        shell: bash
        run: |
          set -euo pipefail
          SOROSLO_CONFIG_PATH=acceptance/demo-soroslo.yml           SOROSLO_DB_PATH=acceptance/demo.sqlite           SOROSLO_API_PORT=3301             node apps/api/dist/main.js > /tmp/soroslo-api.log 2>&1 &

          SOROSLO_API_URL=http://127.0.0.1:3301             pnpm --filter @soroslo/dashboard start --hostname 127.0.0.1 --port 3300             > /tmp/soroslo-dashboard.log 2>&1 &

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3301/healthz >/dev/null &&
               curl --fail --silent http://127.0.0.1:3300 >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/soroslo-api.log || true
          cat /tmp/soroslo-dashboard.log || true
          exit 1

      - name: Capture real Testnet screenshots
        run: node scripts/capture-demo-screenshots.mjs

      - name: Commit screenshots
        run: |
          git add docs/assets/*.png
          if git diff --cached --quiet; then
            echo "No screenshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: add real Testnet dashboard screenshots"
          git push
