name: M4 formatter

on:
  push:
    branches:
      - feat/m4-product-surfaces
    paths:
      - ".github/workflows/m4-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/server.ts apps/api/src/server.test.ts apps/dashboard/src/components/manual-run-button.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.ts apps/api/src/server.test.ts apps/dashboard/src/components/manual-run-button.tsx
          git commit -m "style: format M4 lint fixes"
          git push
