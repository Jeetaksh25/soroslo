name: Release v0.1.0

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify release marker
        id: marker
        shell: bash
        run: |
          if [[ ! -f docs/releases/v0.1.0.md ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(node -p "require('./package.json').version")" != "0.1.0" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.marker.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists; leaving it unchanged."
            exit 0
          fi

          gh release create v0.1.0             --target "$VERIFIED_SHA"             --title "SoroSLO v0.1.0"             --notes-file docs/releases/v0.1.0.md
