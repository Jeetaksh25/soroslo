name: M5 bootstrap 3

on:
  push:
    branches:
      - feat/m5-notifications-hardening
    paths:
      - ".github/workflows/m5-bootstrap3.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update workspace lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Format M5 files
        run: |
          pnpm exec prettier --write             packages/alerts             packages/storage             apps/api             apps/runner             apps/dashboard             e2e             playwright.config.ts             package.json             docker-compose.yml             docs/operations.md             docs/architecture/security-boundaries.md             README.md
      - name: Validate Compose
        env:
          SOROSLO_ADMIN_TOKEN: bootstrap-validation-token
        run: docker compose config --quiet
      - name: Commit generated updates
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml package.json packages apps e2e playwright.config.ts docker-compose.yml docs README.md
          git commit -m "chore: finalize M5 dependencies and formatting"
          git push
