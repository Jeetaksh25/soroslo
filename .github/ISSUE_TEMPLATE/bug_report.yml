name: Bug report
description: Report reproducible incorrect behavior.
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe configuration or sequence that reproduces the issue. Never include secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SoroSLO version or commit
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Additional evidence
      description: Logs or run IDs with secrets removed.
