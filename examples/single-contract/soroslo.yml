version: 1

runtime:
  timezone: UTC
  dataDir: ./.soroslo
  defaultTimeout: 15s

networks:
  testnet:
    preset: testnet

services:
  - id: fixture-service
    name: SoroSLO Testnet fixture
    checks:
      - id: healthy-read
        name: Fixture health and freshness remain usable
        network: testnet
        every: 5m
        timeout: 15s

        slo:
          target: 99.9
          window: 7d
          minEligibleRuns: 20
          maxObserverErrorRate: 5

        steps:
          - id: healthy
            contract: ${SOROSLO_TESTNET_FIXTURE_CONTRACT}
            function: healthy
            args: []
            assertions:
              - path: $
                op: equals
                value: true

          - id: snapshot
            contract: ${SOROSLO_TESTNET_FIXTURE_CONTRACT}
            function: snapshot
            args: []
            assertions:
              - path: $.value
                op: equals
                value: "42"
              - path: $.timestamp
                op: age_lt
                value: 5m
